<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NXT">
  <!-- NXT Eleveta Media mark, reduced for favicon size.
       The full lockup arcs "ELEVETA MEDIA" over the wordmark; at 16px that
       arc is a grey smudge, so only the NXT mark survives here. Brand blue
       and cream are carried over unchanged so the tab still reads as ours. -->
  <rect width="64" height="64" rx="12" fill="#3B6FC2"/>
  <text x="32" y="34"
        text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', 'Noto Serif', serif"
        font-weight="700" font-size="25" letter-spacing="-0.5"
        fill="#F4F0E6">NXT</text>
</svg>
