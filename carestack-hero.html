  <style>
    /* ==========================================================================
       DESIGN SYSTEM & FOUNDATION
       ========================================================================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --dw: 1353;
      --dh: 1163;
      --gutter: 25;
      --u: max(min(.72px, calc(100vh / 700)), min(calc(100vw / 1353), calc(100vh / 1163)));
      --dh-px: calc(1163 * var(--u));
      --vshift: calc(max(0px, (100vh - var(--dh-px))) * .42);
      
      --ink: #ffffff;
      --teal: #4fd1c5;
      --teal-logo: #38b2ac;
      --rule: rgba(255,255,255,.23);
      --btn-ink: #0a1f2b;

      --font-serif: 'Fraunces', Georgia, serif;
      --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-logo: 'Poppins', sans-serif;
    }

    @supports (height: 100dvh) {
      :root {
        --u: max(min(.72px, calc(100dvh / 700)), min(calc(100vw / 1353), calc(100dvh / 1163)));
        --vshift: calc(max(0px, (100dvh - var(--dh-px))) * .42);
      }
    }

    html, body { height: 100%; }

    body {
      background: #04141a;
      color: var(--ink);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: geometricPrecision;
      overflow: hidden;
    }

    /* ==========================================================================
       BACKDROP & STAGE
       ========================================================================== */
    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      isolation: isolate;
    }

    .sky {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .sky video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity .22s linear;
    }

    .sky video.is-active {
      opacity: 1;
    }

    @media (prefers-reduced-motion: reduce) {
      .sky video { display: none; }
    }

    .ui {
      position: absolute;
      inset: 0;
      z-index: 3;
    }

    /* ==========================================================================
       SIDE FACILITY SLOTS
       ========================================================================== */
    .planet {
      position: absolute;
      z-index: -1;
      padding: 0;
      border: 0;
      background: none;
      -webkit-appearance: none;
      appearance: none;
      line-height: 0;
      cursor: pointer;
      pointer-events: auto;
      transition: transform .45s cubic-bezier(.22,1,.36,1);
    }

    .planet img {
      display: none;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 calc(10 * var(--u)) calc(20 * var(--u)) rgba(0,0,0,0.4));
    }

    .planet img.is-shown {
      display: block;
    }

    .planet:hover {
      transform: scale(1.045);
    }

    .planet:active {
      transform: scale(.99);
    }

    .planet-l {
      width: calc(143 * var(--u));
      left: calc(-69.5 * var(--u));
      top: calc(-38.3 * var(--u));
    }

    .planet-r {
      width: calc(143 * var(--u));
      right: calc(-64.7 * var(--u));
      top: calc(-40.6 * var(--u));
    }

    @media (prefers-reduced-motion: reduce) {
      .planet { transition: none; }
      .planet:hover, .planet:active { transform: none; }
    }

    /* ==========================================================================
       LAYOUT & COPY
       ========================================================================== */
    .copy {
      position: absolute;
      inset: 0;
      transform: translateY(var(--vshift));
      pointer-events: none;
    }

    .copy a {
      pointer-events: auto;
    }

    .col {
      position: absolute;
      left: 0;
      right: calc(var(--gutter) * var(--u));
      text-align: center;
    }

    /* ==========================================================================
       NAVIGATION
       ========================================================================== */
    .navbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 6;
      height: calc(88 * var(--u));
    }

    .navbar::after {

      left: calc(25 * var(--u));
      right: calc(49 * var(--u));
      top: calc(86 * var(--u));
      height: calc(2 * var(--u));

    }

    .navrow {
      position: absolute;
      left: calc(25 * var(--u));
      right: calc(49 * var(--u));
      top: 0;
      height: calc(86 * var(--u));

    .logo {

    .burger {

      padding: 0 calc(17.5 * var(--u));
      letter-spacing: calc(-1 * var(--u));

    .links a[aria-current="page"]::after {

      left: 0;

      box-shadow: 0 calc(3 * var(--u)) calc(14 * var(--u)) rgba(255,255,255,.22),

    /* ==========================================================================

       ========================================================================== */
    .eyebrow {

    .rule {

    /* ==========================================================================

       ========================================================================== */
    .cta {
      top: calc(597 * var(--u));
      height: calc(66 * var(--u));

    .cta a {
      display: inline-flex;
      align-items: center;

      width: calc(216 * var(--u));
      height: calc(66 * var(--u));
      border-radius: calc(33 * var(--u));
      font-size: calc(17 * var(--u));
      font-weight: 700;
      letter-spacing: 0;

      box-shadow: 0 calc(10 * var(--u)) calc(18 * var(--u)) calc(-8 * var(--u)) rgba(255,255,255,.50),

    .label {
      position: absolute;
      top: calc(33 * var(--u));
      font-family: var(--font-serif);
      font-weight: 400;
      font-size: calc(15.5 * var(--u));

    }

    .label.label-l { left: calc(105 * var(--u)); }
    .label.label-r { right: calc(98 * var(--u)); }

    /* ==========================================================================
       SCROLL CONTROL
       ========================================================================== */
    .scroll {
      position: absolute;
      z-index: 4;
      left: 50%;
      margin-left: calc((-48 - (var(--gutter) / 2)) * var(--u));
      bottom: calc(68 * var(--u));
      width: calc(96 * var(--u));
      height: calc(96 * var(--u));
      border-radius: 50%;
      background: rgba(14,32,38,.70);
      -webkit-backdrop-filter: blur(calc(6 * var(--u)));
      backdrop-filter: blur(calc(6 * var(--u)));
      border: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .scroll svg {
      width: calc(20 * var(--u));
      height: calc(25 * var(--u));
      display: block;
    }

    /* ==========================================================================
       FOCUS STYLES
       ========================================================================== */
    .scroll:focus-visible, .links a:focus-visible, .enroll:focus-visible,
    .cta a:focus-visible, .logo:focus-visible {
      outline: calc(2 * var(--u)) solid var(--teal);

    }

    .planet:focus-visible {

    /* ==========================================================================
       RESPONSIVE TIERS (Exact Order Specification)
       ========================================================================== */
    
    /* A) NAV COLLAPSE */
    @media (max-width:1030px), (max-height:620px) {

        top: calc(96 * var(--u));

        z-index: 5;
        width: min(calc(324 * var(--u)), calc(100vw - 50 * var(--u)));

        align-items: stretch;
        padding: calc(12 * var(--u));
        border-radius: calc(20 * var(--u));
        background: rgba(7,26,32,.84);
        -webkit-backdrop-filter: blur(calc(18 * var(--u)));
        backdrop-filter: blur(calc(18 * var(--u)));
        border: calc(1 * var(--u)) solid rgba(255,255,255,.14);
        box-shadow: 0 calc(18 * var(--u)) calc(44 * var(--u)) rgba(2,14,18,.55);
        opacity: 0;
        visibility: hidden;
        transform: translateY(calc(-10 * var(--u)));
        transition: opacity .24s ease, transform .28s cubic-bezier(.4,0,.2,1), visibility .28s;
      }
      .navrow[data-open="true"] .links { opacity: 1; visibility: visible; transform: none; }
      .links a:nth-child(n) {
        margin-left: 0;
        height: auto;
        justify-content: flex-start;
        padding: calc(14 * var(--u)) calc(16 * var(--u));
        font-size: calc(19 * var(--u));
        letter-spacing: calc(-.6 * var(--u));
      }
      .links a + a { border-top: calc(1 * var(--u)) solid rgba(255,255,255,.08); }

        right: auto;
        width: calc(26 * var(--u));
        height: calc(3 * var(--u));
      }
      .links a.enroll {

        padding-top: calc(2 * var(--u));
        font-size: calc(18 * var(--u));
        letter-spacing: calc(-.4 * var(--u));
        border-top: 0;
      }
      .links a.enroll::after { content: none; }
    }

    /* B) TABLET */
    @media (min-width:580px) and (max-width:1030px) and (min-height:621px) {

    }
    @supports (height:100dvh) {

        }

    }

    }
    @media (max-width:579px), (max-height:620px) {

    /* ==========================================================================
       ENTRANCE ANIMATIONS
       ========================================================================== */
    @keyframes ent-reveal { from { transform: translateY(115%); } to { transform: translateY(0); } }
    @keyframes ent-rise { from { opacity: 0; transform: translateY(var(--rise,10px)); } to { opacity: 1; transform: none; } }

    @keyframes ent-draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes ent-fade { from { opacity: 0; } to { opacity: 1; } }

    .anim {
      --e-expo: cubic-bezier(.16,1,.3,1);
      --e-quint: cubic-bezier(.22,1,.36,1);
      --e-slow: cubic-bezier(.4,0,.2,1);
    }
    .ent-mask, .ent-line { display: block; }
    .anim .ent-mask { overflow: hidden; padding-top: .18em; margin-top: -.18em; }
    .anim .ent-line { transform: translateY(115%); will-change: transform; }

    .anim.play .navbar::after { animation: ent-draw .9s var(--e-expo) .12s both; }
    .anim.play .logo { --rise: calc(8 * var(--u)); animation: ent-rise .6s var(--e-quint) .20s both; }

    .anim.play .links a:nth-child(1) { --rise: calc(8 * var(--u)); animation: ent-rise .55s var(--e-quint) .26s both; }
    .anim.play .links a:nth-child(2) { --rise: calc(8 * var(--u)); animation: ent-rise .55s var(--e-quint) .31s both; }
    .anim.play .links a:nth-child(3) { --rise: calc(8 * var(--u)); animation: ent-rise .55s var(--e-quint) .36s both; }
    .anim.play .links a:nth-child(4) { --rise: calc(8 * var(--u)); animation: ent-rise .55s var(--e-quint) .41s both; }

    .anim.play .links a.enroll, .anim.play .burger { --rise: calc(8 * var(--u)); animation: ent-settle .6s var(--e-quint) .46s both; }
    .anim.play .links a[aria-current="page"]::after { animation: ent-draw .55s var(--e-expo) .60s both; }

    .anim.play .eyebrow .ent-line { animation: ent-reveal .75s var(--e-expo) .30s both; }
    .anim.play h1.title .ent-line { animation: ent-reveal .95s var(--e-expo) .44s both; }
    .anim.play .rule span { animation: ent-draw .65s var(--e-expo) .78s both; }
    .anim.play p.lede { --rise: calc(12 * var(--u)); animation: ent-rise .7s var(--e-quint) .86s both; }
    .anim.play .label.label-l { --rise: calc(8 * var(--u)); animation: ent-rise .6s var(--e-quint) 1.04s both; }
    .anim.play .label.label-r { --rise: calc(8 * var(--u)); animation: ent-rise .6s var(--e-quint) 1.10s both; }
    .anim.play .cta a { --rise: calc(8 * var(--u)); animation: ent-settle .7s var(--e-quint) 1.14s both; }
    .anim.play .scroll { animation: ent-settle .6s var(--e-quint) 1.42s both; }
  </style>
</head>

    <!-- Scroll Down Control -->
    <button class="scroll" type="button" aria-label="Scroll to next section">
      <svg viewBox="0 0 26 33" fill="none" aria-hidden="true">
        <path d="M13 1.5 V31.5 M1.9 20.4 L13 31.5 L24.1 20.4" stroke="#ffffff" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>

  <!-- Script logic before </body> -->
  <script>
    (function(){
      // 1. Entrance Driver
      if (document.documentElement.classList.contains('anim')) {
        var startAnim = function() {
          requestAnimationFrame(function() {
            requestAnimationFrame(function() {
              document.documentElement.classList.add('play');
              setTimeout(function() {
                document.documentElement.classList.remove('anim', 'play');
              }, 2150);
            });
          });
        };
        if (document.fonts && document.fonts.ready) {
          var fontDone = false;
          var fontGuard = setTimeout(function() {
            if (!fontDone) { fontDone = true; startAnim(); }
          }, 500);
          document.fonts.ready.then(function() {
            if (!fontDone) { fontDone = true; clearTimeout(fontGuard); startAnim(); }
          });
        } else {
          startAnim();
        }
      }

      // 2. Facility Data & Switcher Logic
      var ORDER = ['hospital', 'clinic', 'lab'];
      
      var FACILITY_DATA = {
        hospital: {
          name: 'HOSPITAL',
          sideLabel: 'HOSPITAL',
          still: 'https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?q=80&w=1600&auto=format&fit=crop',
          clip: 'https://assets.mixkit.co/videos/preview/mixkit-nurse-walking-down-a-hospital-corridor-41560-large.mp4',
          lede: 'Run OPD, IPD, pharmacy and billing from one system built for your facility. Every module toggles on per-facility, so you only <br>see what you need. Onboarding takes a single afternoon, not a quarter.'
        },
        clinic: {
          name: 'CLINIC',
          sideLabel: 'CLINIC',
          still: 'https://images.unsplash.com/photo-1629909613654-28e377c37b09?q=80&w=1600&auto=format&fit=crop',
          clip: 'https://assets.mixkit.co/videos/preview/mixkit-doctor-explaining-a-treatment-to-a-patient-41558-large.mp4',
          lede: 'Built for outpatient volume — fast check-in, doctor queueing, and same-day billing without the overhead a <br>full hospital stack doesn\'t need for a clinic.'
        },
        lab: {
          name: 'DIAGNOSTIC LAB',
          sideLabel: 'LAB',
          still: 'https://images.unsplash.com/photo-1579154204601-01588f351e67?q=80&w=1600&auto=format&fit=crop',
          clip: 'https://assets.mixkit.co/videos/preview/mixkit-scientist-working-in-a-laboratory-41566-large.mp4',
          lede: 'Sample tracking, report generation, and TPA-ready billing for diagnostic labs — from order to result <br>without a single spreadsheet in between.'
        }
      };

      var currentFeatured = null;

      function show(next) {
        if (!FACILITY_DATA[next] || currentFeatured === next) return;
        currentFeatured = next;

        // Backdrop videos & stills
        var sky = document.querySelector('.sky');
        var videos = sky.querySelectorAll('video');
        videos.forEach(function(v) {
          var planet = v.dataset.planet;
          if (planet === next) {
            if (!v.src && v.dataset.src) {
              v.src = v.dataset.src;
            }
            v.classList.add('is-active');
            var p = v.play();
            if (p && typeof p.catch === 'function') p.catch(function(){});
          } else {
            v.classList.remove('is-active');
            v.pause();
          }
        });

        sky.style.backgroundImage = 'url("' + FACILITY_DATA[next].still + '")';

        // Title and Lede
        var h1Line = document.querySelector('h1.title .ent-line');
        if (h1Line) h1Line.textContent = FACILITY_DATA[next].name;

        var ledeP = document.querySelector('p.lede');
        if (ledeP) ledeP.innerHTML = FACILITY_DATA[next].lede;

        // Slots calculation
        var rest = ORDER.filter(function(item) { return item !== next; });
        var leftType = rest[0];
        var rightType = rest[1];

        var btnL = document.querySelector('.planet-l');
        var btnR = document.querySelector('.planet-r');
        var labelL = document.querySelector('.label-l');
        var labelR = document.querySelector('.label-r');

        if (btnL) {
          btnL.dataset.planet = leftType;
          btnL.setAttribute('aria-label', 'Show ' + FACILITY_DATA[leftType].name);
          btnL.querySelectorAll('img').forEach(function(img) {
            img.classList.toggle('is-shown', img.dataset.planet === leftType);
          });
        }
        if (labelL) {
          labelL.textContent = FACILITY_DATA[leftType].sideLabel;
        }

        if (btnR) {
          btnR.dataset.planet = rightType;
          btnR.setAttribute('aria-label', 'Show ' + FACILITY_DATA[rightType].name);
          btnR.querySelectorAll('img').forEach(function(img) {
            img.classList.toggle('is-shown', img.dataset.planet === rightType);
          });
        }
        if (labelR) {
          labelR.textContent = FACILITY_DATA[rightType].sideLabel;
        }
      }

      function warm(facility) {
        var data = FACILITY_DATA[facility];
        if (!data) return;
        var video = document.querySelector('video[data-planet="' + facility + '"]');
        if (video && !video.src && video.dataset.src) {
          video.preload = 'auto';
          video.src = video.dataset.src;
          video.load();
        }
      }

      // Bind planet buttons
      var btnL = document.querySelector('.planet-l');
      var btnR = document.querySelector('.planet-r');

      [btnL, btnR].forEach(function(btn) {
        if (!btn) return;
        var handleWarm = function() {
          var planet = btn.dataset.planet;
          if (planet) warm(planet);
        };
        btn.addEventListener('pointerenter', handleWarm, { passive: true });
        btn.addEventListener('focus', handleWarm, { passive: true });
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          if (this.dataset.planet) show(this.dataset.planet);
        });
      });

      // Warm idle callback
      var warmAll = function() {
        ORDER.forEach(function(f) { warm(f); });
      };
      if ('requestIdleCallback' in window) {
        requestIdleCallback(warmAll, { timeout: 4000 });
      } else {
        setTimeout(warmAll, 2500);
      }

      // Initial state
      show('hospital');

      // 3. Burger Navigation
      var navrow = document.querySelector('.navrow');
      var burgerBtn = document.querySelector('.burger');

      function setBurgerOpen(open) {
        if (!navrow || !burgerBtn) return;
        navrow.dataset.open = open ? 'true' : 'false';
        burgerBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
        burgerBtn.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
      }

      if (burgerBtn) {
        setBurgerOpen(false);
        burgerBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          var isOpen = navrow.dataset.open === 'true';
          setBurgerOpen(!isOpen);
        });
      }

      document.addEventListener('click', function(e) {
        if (navrow && navrow.dataset.open === 'true') {
          var siteNav = document.getElementById('site-nav');
          if (!siteNav.contains(e.target) && !burgerBtn.contains(e.target)) {
            setBurgerOpen(false);
          }
        }
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && navrow && navrow.dataset.open === 'true') {
          setBurgerOpen(false);
          if (burgerBtn) burgerBtn.focus();
        }
      });

      var navLinks = document.querySelectorAll('.links a');
      navLinks.forEach(function(link) {
        link.addEventListener('click', function() {
          setBurgerOpen(false);
        });
      });
    })();
  </script>
</body>
